# Every pull request and every push to staging or main runs the tests, so a check like
# test/no-contact-in-data-files.test.js stops a change before it merges, not after.
name: Tests
on:
  pull_request:
  push:
    branches: [staging, main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
