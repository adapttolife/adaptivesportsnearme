name: Test ASNM changes
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.5.1'
      - run: node --test
# Deliberately no deploy, secrets, remote D1 commands, or production permissions.
# Branch-protection changes remain a separate repository-owner decision.
