<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Direction A · Clear · Adaptive Sports Near Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#141414;--ink2:#3d3c39;--muted:#6b6a66;--line:#e7e5e0;--paper:#fff;--bg:#faf9f6;--accent:#c5430c;--accent-ink:#a3370a;--accent-soft:#fbebdf;--ok:#1d6a3a;--okbg:#e6f1e9;--r:14px;--max:1120px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"DM Sans",system-ui,sans-serif;font-size:17px;line-height:1.55;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding:0 20px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:#fff;padding:8px 12px;z-index:9}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
/* beta + header */
.beta{background:var(--ink);color:#fff;font-size:14px}
.beta .wrap{display:flex;gap:10px;align-items:center;min-height:40px}
.beta b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:1px 8px}
.beta a{color:#fff;font-weight:600}
header.top{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;letter-spacing:-.01em;font-size:18px}
.brand img{width:30px;height:30px}
nav.main{margin-left:auto;display:flex;gap:6px;align-items:center}
nav.main a{text-decoration:none;font-weight:500;color:var(--ink2);padding:10px 12px;border-radius:10px;font-size:16px}
nav.main a:hover{background:var(--bg)}
nav.main .add{background:var(--ink);color:#fff;font-weight:600}
nav.main .add:hover{background:#000}
@media (max-width:760px){nav.main .hide-s{display:none}.brand span{font-size:16px}nav.main .add{padding:9px 12px;font-size:15px}.brand img{width:26px;height:26px}}
@media (max-width:420px){.brand span .long{display:none}}
/* hero */
.hero{background:var(--paper);border-bottom:1px solid var(--line)}
.hero .wrap{padding-top:56px;padding-bottom:52px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:56px;align-items:start}
.hero aside{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:22px 22px 10px;margin-top:8px}
.hero aside h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero aside .row{padding:14px 2px}.hero aside .rn{font-size:17px}
@media (max-width:960px){.hero .wrap{grid-template-columns:1fr}.hero aside{display:none}}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.04;letter-spacing:-.035em;font-weight:700;max-width:14ch}
.hero p.sub{font-size:clamp(18px,2.2vw,21px);color:var(--ink2);margin-top:14px;max-width:46ch}
form.find{margin-top:28px;display:grid;grid-template-columns:1.5fr 1fr auto;gap:10px;max-width:820px}
form.find label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px 2px}
form.find input,form.find select{width:100%;height:56px;border:1.5px solid #cfccc5;border-radius:12px;padding:0 16px;font:inherit;font-size:18px;background:#fff;color:var(--ink)}
form.find input:focus,form.find select:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(20,20,20,.08)}
form.find button{align-self:end;height:56px;padding:0 26px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:18px;cursor:pointer}
form.find button:hover{background:var(--accent-ink)}
.try{margin-top:14px;font-size:15px;color:var(--muted)}
.try a{color:var(--ink2);font-weight:600;margin-right:12px}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:26px;font-size:15px;color:var(--ink2)}
.facts b{font-weight:700;color:var(--ink)}
@media (max-width:760px){form.find{grid-template-columns:1fr}.hero .wrap{padding-top:36px;padding-bottom:36px}}
/* sections */
section.blk{padding:48px 0;border-bottom:1px solid var(--line)}
section.blk h2{font-size:26px;letter-spacing:-.02em;font-weight:700}
section.blk p.lead{color:var(--ink2);margin-top:6px;max-width:60ch}
.states{margin-top:22px;display:grid;grid-template-columns:repeat(5,1fr);gap:0 28px}
.states a{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);text-decoration:none;font-size:16px}
.states a:hover .nm{text-decoration:underline}
.states .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:15px}
@media (max-width:960px){.states{grid-template-columns:repeat(3,1fr)}}
@media (max-width:620px){.states{grid-template-columns:repeat(2,1fr);gap:0 18px}}
.sports{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px}
.sports a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line);background:#fff;border-radius:99px;text-decoration:none;font-weight:500}
.sports a:hover{border-color:var(--ink)}
.sports .n{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.grants{margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grant{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grant .who{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grant h3{font-size:18px;line-height:1.3;margin-top:6px}
.grant p{font-size:15px;color:var(--ink2);margin-top:6px}
@media (max-width:760px){.grants{grid-template-columns:1fr}}
.help{background:var(--paper)}
.help ul{list-style:none;margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.help li{border-top:3px solid var(--ink);padding-top:12px}
.help li b{display:block;font-size:17px}
.help li span{color:var(--ink2);font-size:15.5px}
@media (max-width:760px){.help ul{grid-template-columns:1fr}}
.more{display:inline-block;margin-top:18px;font-weight:600}
/* results */
.rhead{background:var(--paper);border-bottom:1px solid var(--line)}
.rhead .wrap{padding-top:28px;padding-bottom:22px}
.crumb{font-size:14px;color:var(--muted)}.crumb a{color:var(--muted)}
.rhead h1{font-size:clamp(28px,4.5vw,42px);letter-spacing:-.03em;line-height:1.1;margin-top:8px}
.rhead .sum{margin-top:8px;color:var(--ink2)}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.bar select,.bar input[type=text]{height:46px;border:1.5px solid #cfccc5;border-radius:10px;padding:0 12px;font:inherit;font-size:16px;background:#fff}
.bar label.chk{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 14px;border:1.5px solid #cfccc5;border-radius:10px;background:#fff;font-size:16px;cursor:pointer}
.bar label.chk input{width:18px;height:18px;accent-color:var(--ok)}
.groups{padding-top:12px;padding-bottom:56px;max-width:860px}
.group h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:30px 0 4px;font-weight:700}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;padding:18px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.row:hover .rn{text-decoration:underline}
.rn{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.rm{grid-column:1;font-size:15.5px;color:var(--ink2)}
.rm .fam{font-weight:600;color:var(--ink)}
.tr{grid-column:2;grid-row:1/3;font-size:14px;font-weight:600;white-space:nowrap}
.tr.ok{color:var(--ok)}.tr.no{color:var(--muted);font-weight:500}
.tr.ok::before{content:"✓ "}
.empty{padding:24px;border:1px dashed #cfccc5;border-radius:var(--r);color:var(--ink2);margin-top:12px}
/* listing */
.doc{padding-top:28px;padding-bottom:64px;max-width:800px}
.doc h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.03em;line-height:1.08;margin-top:10px}
.doc .meta{font-size:18px;color:var(--ink2);margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:6px 12px;border-radius:99px;font-size:14.5px;font-weight:600}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.no{background:#f0eee9;color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;border-radius:12px;font-weight:700;text-decoration:none;font-size:17px}
.btn.pri{background:var(--accent);color:#fff}.btn.pri:hover{background:var(--accent-ink)}
.btn.sec{border:1.5px solid var(--ink);background:#fff}
.desc{margin-top:26px;font-size:18px;color:var(--ink2);max-width:62ch}
dl.facts2{margin-top:26px;border-top:1px solid var(--line)}
dl.facts2 div{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
dl.facts2 dt{color:var(--muted)}dl.facts2 dd{font-weight:500;overflow-wrap:anywhere}
.about{margin-top:34px;padding:22px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.about h2{font-size:20px}.about p{margin-top:8px;color:var(--ink2)}
.about .fix{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.about .fix a{font-weight:600}
footer{padding:40px 0 60px;color:var(--muted);font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}
footer a{color:var(--ink2)}
</style>
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<div class="beta"><div class="wrap"><b>Beta</b><span>New and still growing. <a href="#help">Help us build it</a></span></div></div>
<header class="top"><div class="wrap">
  <a class="brand" href="#"><img src="/emblems/athlete.svg" alt=""><span><span class="long">Adaptive Sports </span>Near Me</span></a>
  <nav class="main" aria-label="Main"><a class="hide-s" href="#near=">Programs</a><a class="hide-s" href="#funding">Funding</a><a class="hide-s" href="/resources">Resources</a><a class="add" href="/?add=program">+ Add<span class="hide-s"> a program</span></a></nav>
</div></header>
<main id="app"></main>
<footer><div class="wrap"><span>A free, open directory from Adapt To Life, a 501(c)(3) nonprofit. No logins, no fees, never a money ask.</span><span><a href="/resources">Resources</a> · <a href="/?about=verify">How we verify</a> · <a href="/?about=help">Help build this</a></span></div></footer>
<script src="/listing-art.js"></script>
<script src="/design/core.js"></script>
<script>
const P = window.Proto, E = P.esc;
let D;
const params = () => Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
function famOptions(sel) {
  return '<option value="">Any sport</option>' + Object.entries(D.families).sort((a,b)=>b[1]-a[1])
    .map(([k,n]) => `<option value="${k}"${k===sel?' selected':''}>${E(P.FAMILY_LABEL[k]||k)} (${n})</option>`).join("");
}
function row(p) {
  return `<a class="row" href="#p=${p.id}"><span class="rn">${E(p.name)}</span><span class="rm"><span class="fam">${E(p.familyLabel)}</span> · ${E(P.place(p))}</span><span class="tr ${p.verified?'ok':'no'}">${p.verified?'Verified':'Not yet verified'}</span></a>`;
}
function home() {
  const st = Object.entries(D.byState).sort((a,b)=>P.STATE_NAMES[a[0]].localeCompare(P.STATE_NAMES[b[0]]));
  const fams = Object.entries(D.families).sort((a,b)=>b[1]-a[1]).slice(0,14);
  const ver = D.items.filter(p=>p.verified).length;
  const g = D.grants.filter(x=>x.open).slice(0,3);
  return `
  <section class="hero"><div class="wrap"><div>
    <h1>Find adaptive sports near you.</h1>
    <p class="sub">Programs, teams and clinics for athletes with disabilities, in every state. Free to use, no account.</p>
    <form class="find" onsubmit="go(event)">
      <div><label for="w">Where</label><input id="w" name="w" placeholder="ZIP code or city" autocomplete="postal-code" required></div>
      <div><label for="s">Sport</label><select id="s" name="s">${famOptions("")}</select></div>
      <button type="submit">Search</button>
    </form>
    <p class="try">Try <a href="#near=Chicago">Chicago</a><a href="#near=33602">33602</a><a href="#near=Wisconsin">Wisconsin</a></p>
    <div class="facts"><span><b>${D.items.length.toLocaleString()}</b> programs</span><span><b>${ver.toLocaleString()}</b> verified by a person</span><span>All <b>50</b> states and DC</span></div>
    </div>
    <aside aria-label="Recently verified"><h2>Recently verified</h2>${D.items.filter(p=>p.verified&&P.cleanCity(p.city)).sort((x,y)=>String(y.lastChecked||'').localeCompare(String(x.lastChecked||''))).slice(0,4).map(row).join("")}</aside>
  </div></section>
  <section class="blk"><div class="wrap"><h2>Browse by state</h2><p class="lead">Every state, with the number of programs we list there today.</p>
    <div class="states">${st.map(([c,l])=>`<a href="#near=${c}"><span class="nm">${E(P.STATE_NAMES[c])}</span><span class="n">${l.length}</span></a>`).join("")}</div></div></section>
  <section class="blk"><div class="wrap"><h2>Browse by sport</h2>
    <div class="sports">${fams.map(([k,n])=>`<a href="#near=&s=${k}">${E(P.FAMILY_LABEL[k]||k)} <span class="n">${n}</span></a>`).join("")}</div></div></section>
  <section class="blk" id="funding"><div class="wrap"><h2>Help paying for it</h2><p class="lead">Grants for athletes and for programs: equipment, training, travel.</p>
    <div class="grants">${g.map(x=>`<div class="grant"><div class="who">${x.audience==='program'?'For programs':'For athletes'}</div><h3>${E(x.name)}</h3><p>${E([x.amount,x.deadline].filter(Boolean).join(' · '))}</p></div>`).join("")}</div>
    <a class="more" href="/grants">All ${D.grants.length} grants →</a></div></section>
  <section class="blk help" id="help"><div class="wrap"><h2>Help build this</h2><p class="lead">The directory is new. It gets better fastest with people who know adaptive sports where they live.</p>
    <ul><li><b>Know a program we are missing?</b><span>Add it in two minutes. A person reviews every one.</span></li><li><b>See something wrong?</b><span>Every listing has a button to suggest an update.</span></li><li><b>Run a program?</b><span>Confirm your listing and it shows as verified.</span></li></ul></div></section>`;
}
function results(q) {
  const where = P.parsePlace(q.near, D.items);
  const fam = q.s || "";
  if (!where) {
    const list = D.items.filter(p=>!fam||p.family===fam).sort(P.byTrust);
    return `<div class="rhead"><div class="wrap"><div class="crumb"><a href="#">Home</a> / Programs</div><h1>${fam?E(P.FAMILY_LABEL[fam]):'All programs'}</h1><p class="sum">${list.length} programs across the country. Add your ZIP or city to see what is close.</p>${bar(q)}</div></div><div class="wrap groups">${list.slice(0,40).map(row).join("")}</div>`;
  }
  const g = P.groupFor(where, D.items, fam);
  const sec = (title, list) => list.length ? `<div class="group"><h2>${title} · ${list.length}</h2>${list.map(row).join("")}</div>` : "";
  const st = P.STATE_NAMES[where.state];
  return `<div class="rhead"><div class="wrap"><div class="crumb"><a href="#">Home</a> / <a href="#near=${where.state}">${E(st)}</a></div>
    <h1>${fam?E(P.FAMILY_LABEL[fam])+' near ':'Adaptive sports near '}${E(where.label)}</h1>
    <p class="sum">${g.total} programs in ${E(st)}, ${g.verified} verified by a person.</p>${bar(q)}</div></div>
    <div class="wrap groups">${g.total? sec(where.city?'In '+E(where.city):'With a city on file', where.city?g.inCity:g.rest) + (where.city?sec('Elsewhere in '+E(st), g.rest):'') + sec('Across '+E(st)+' · city not listed', g.noCity)
      : `<div class="empty">Nothing in ${E(st)} yet${fam?' for '+E(P.FAMILY_LABEL[fam]).toLowerCase():''}. <a href="/?add=program">Add a program you know</a>.</div>`}</div>`;
}
function bar(q) {
  return `<form class="bar" onsubmit="go(event)"><input type="text" name="w" value="${E(q.near||'')}" placeholder="ZIP or city" aria-label="Where"><select name="s" aria-label="Sport">${famOptions(q.s||"")}</select><label class="chk"><input type="checkbox" disabled> Verified only</label></form>`;
}
function listing(id) {
  const p = D.items.find(x=>x.id===id); if (!p) return '<div class="wrap doc"><h1>Not found</h1></div>';
  const st = P.STATE_NAMES[p.state] || "";
  const more = (D.byState[p.state]||[]).filter(x=>x.id!==p.id && x.family===p.family).sort(P.byTrust).slice(0,4);
  const facts = [["Sport", p.sportLabel], ["Where", P.place(p)], ["Cost", p.cost], ["Ages", p.ages], ["Equipment", p.equipment]].filter(f=>f[1]);
  return `<div class="wrap doc"><div class="crumb"><a href="#">Home</a> / <a href="#near=${p.state}">${E(st)}</a> / ${E(p.familyLabel)}</div>
    <h1>${E(p.name)}</h1><p class="meta">${E(p.familyLabel)} · ${E(P.place(p))}</p>
    <span class="badge ${p.verified?'ok':'no'}">${p.verified?'✓ Verified by our team':'Not yet verified'}</span>
    <div class="acts">${p.website?`<a class="btn pri" href="${E(p.website)}" target="_blank" rel="noopener">Visit website</a>`:''}<a class="btn sec" href="/?update=${p.id}">Suggest an update</a></div>
    ${p.desc?`<p class="desc">${E(p.desc)}</p>`:''}
    <dl class="facts2">${facts.map(([k,v])=>`<div><dt>${k}</dt><dd>${E(v)}</dd></div>`).join("")}</dl>
    <div class="about"><h2>About this listing</h2><p>${p.verified?'A person on our team checked this program against an official source. Schedules change, so check the website before you go.':'No one on our team has confirmed this listing yet. Check the website or call before you go.'}</p>
      <div class="fix"><a href="/?update=${p.id}&rel=run">Run this program? Confirm your listing</a></div></div>
    ${more.length?`<div class="group"><h2>More ${E(p.familyLabel.toLowerCase())} in ${E(st)}</h2>${more.map(row).join("")}</div>`:''}</div>`;
}
function go(e){ e.preventDefault(); const f=e.target; location.hash = new URLSearchParams({near:f.w.value, s:f.s.value}).toString(); }
function render(){ const q=params(); const el=document.getElementById("app");
  el.innerHTML = q.p ? listing(q.p) : ("near" in q ? results(q) : home()); window.scrollTo(0,0); }
P.load().then(d=>{ D=d; render(); window.addEventListener("hashchange", render); });
</script>
</body>
</html>
